name: K1ext macOS DMG
on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "Private source repository"
        required: true
        default: alzscriptz/K1ext
        type: string
      source_ref:
        description: "Branch or tag to build"
        required: true
        default: main
        type: string
      build_name:
        description: "GitBack release name"
        required: true
        default: K1ext 1.1.3 — Resource Bundle Crash Fix
        type: string
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout private K1ext source
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.TOKEN }}
          persist-credentials: false
      - name: Build and package macOS DMG
        shell: bash
        env:
          VERSION: "1.1.3"
        run: |
          set -euo pipefail
          xcode-select -p
          swift --version
          chmod +x ./build.sh
          ./build.sh
          test -s "dist/K1ext-${VERSION}-macOS.dmg"
      - name: Upload DMG build artifact
        uses: actions/upload-artifact@v4
        with:
          name: K1ext-${{ github.run_number }}-macOS-DMG
          path: dist/K1ext-1.1.3-macOS.dmg
          if-no-files-found: error
          retention-days: 30
      - name: Publish DMG to GitBack release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: K1ext-1.1.3-${{ github.run_number }}
          name: "${{ inputs.build_name }}"
          body: |
            macOS DMG built from private source ${{ inputs.source_repo }} @ ${{ inputs.source_ref }}.
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: dist/K1ext-1.1.3-macOS.dmg
          fail_on_unmatched_files: true
