name: GitBack Runner — K1e0n DMG

on:
  workflow_dispatch:
    inputs:
      source_ref:
        description: Private K1e0n branch, tag, or commit
        required: true
        default: main
        type: string
      build_id:
        description: DMG filename/version label
        required: true
        default: K1e0n-macOS
        type: string

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    steps:
      - name: Checkout private K1e0n source
        uses: actions/checkout@v4
        with:
          repository: alzscriptz/K1e0n
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.TOKEN }}
          persist-credentials: false
          path: source

      - name: Build K1e0n DMG
        shell: bash
        working-directory: source
        run: |
          set -euo pipefail
          make dmg
          test -s build/K1e0n.dmg

      - name: Upload DMG to private K1e0n repository
        env:
          GH_TOKEN: ${{ secrets.K1E0N_TOKEN }}
          BUILD_ID: ${{ inputs.build_id }}
          SOURCE_REF: ${{ inputs.source_ref }}
        run: |
          set -euo pipefail
          test -n "$GH_TOKEN"
          gh release create "$BUILD_ID-${GITHUB_RUN_NUMBER}" \
            "$GITHUB_WORKSPACE/source/build/K1e0n.dmg#K1e0n.dmg" \
            --repo alzscriptz/K1e0n \
            --title "$BUILD_ID" \
            --notes "DMG built from private K1e0n source ref: $SOURCE_REF. GitBack run: ${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
