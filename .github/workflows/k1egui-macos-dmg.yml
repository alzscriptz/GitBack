name: K1eGUI macOS DMG (private source)

on:
  push:
    paths:
      - ".github/workflows/k1egui-macos-dmg.yml"
  workflow_dispatch:
    inputs:
      source_ref:
        description: Private k1egui branch, tag, or commit to build
        required: true
        default: feat/macos-dmg-release
        type: string

permissions:
  contents: read

jobs:
  build-macos:
    runs-on: macos-latest
    env:
      SOURCE_REF: ${{ github.event.inputs.source_ref || 'feat/macos-dmg-release' }}
    steps:
      - name: Check out private K1eGUI source
        uses: actions/checkout@v4
        with:
          repository: alzscriptz/k1egui
          ref: ${{ github.event.inputs.source_ref || 'feat/macos-dmg-release' }}
          token: ${{ secrets.TOKEN }}
          persist-credentials: false
          path: source

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: source/package.json

      - name: Install dependencies
        working-directory: source
        run: npm install

      - name: Verify native Studio MCP runtime
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          node --check electron/main.cjs
          node --check electron/mcp.cjs
          node --check electron/studio-agent.cjs
          node -e "Promise.all([import('@modelcontextprotocol/sdk/client/index.js'), import('@modelcontextprotocol/sdk/client/stdio.js')]).then(() => console.log('MCP SDK client and stdio transport load successfully.'))"
          npm ls @modelcontextprotocol/sdk


      - name: Build Next.js standalone app
        working-directory: source
        run: npm run build

      # Ensure runtime dependencies are physically present beside server.js in the packaged app.
      # The previous smoke test proved this standalone output lacked the "next" module.
      - name: Ensure standalone server runtime dependencies are packaged
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .next/standalone/node_modules
          ditto node_modules .next/standalone/node_modules
          test -f .next/standalone/node_modules/next/package.json
          echo "Next.js runtime dependency present in standalone bundle."

      - name: Package macOS app bundle
        working-directory: source
        run: npx electron-builder --mac dir --publish never

      - name: Ensure packaged app contains Next.js runtime
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find release -maxdepth 3 -type d -name 'K1eGUI.app' -print -quit)"
          test -n "$APP_PATH"
          APP_RESOURCES="$APP_PATH/Contents/Resources/app"
          echo "Checking where electron-builder placed the standalone dependencies..."
          find "$APP_RESOURCES" -maxdepth 3 -path '*/next/package.json' -print | head -20 || true
          # electron-builder's default ignore rules can omit node_modules from extraResources.
          # Explicitly put the built standalone runtime next to server.js in the actual .app.
          mkdir -p "$APP_RESOURCES/node_modules"
          ditto .next/standalone/node_modules "$APP_RESOURCES/node_modules"
          test -f "$APP_RESOURCES/node_modules/next/package.json"
          test -f "$APP_RESOURCES/server.js"
          echo "Packaged app has server.js and node_modules/next/package.json."

      - name: Ad-hoc sign app and verify its bundle
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find release -maxdepth 3 -type d -name 'K1eGUI.app' -print -quit)"
          test -n "$APP_PATH"
          codesign --force --deep --sign - "$APP_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          xattr -cr "$APP_PATH"

      - name: Smoke-test packaged app startup
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find release -maxdepth 3 -type d -name 'K1eGUI.app' -print -quit)"
          test -n "$APP_PATH"
          RESOURCES="$APP_PATH/Contents/Resources"
          echo "Checking packaged standalone server bundle..."
          ls -la "$RESOURCES/app" | head -40
          test -f "$RESOURCES/app/server.js"
          OUT_LOG="$RUNNER_TEMP/k1egui-stdout.log"
          ERR_LOG="$RUNNER_TEMP/k1egui-stderr.log"
          open --stdout "$OUT_LOG" --stderr "$ERR_LOG" "$APP_PATH"
          ready=0
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:41739/ >/dev/null; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "Packaged K1eGUI did not serve HTTP on 127.0.0.1:41739."
            echo "--- app stdout ---"
            cat "$OUT_LOG" 2>/dev/null || true
            echo "--- app stderr ---"
            cat "$ERR_LOG" 2>/dev/null || true
            echo "--- running K1eGUI processes ---"
            ps aux | grep -i '[K]1eGUI\|[s]erver.js' || true
            echo "--- recent unified logs ---"
            log show --last 3m --style compact --predicate 'process CONTAINS[c] "K1eGUI" OR eventMessage CONTAINS[c] "K1eGUI"' 2>/dev/null | tail -100 || true
            exit 1
          fi
          osascript -e 'tell application "K1eGUI" to quit' || true
          sleep 2

      - name: Create DMG containing tested app
        working-directory: source
        shell: bash
        run: |
          set -euo pipefail
          APP_PATH="$(find release -maxdepth 3 -type d -name 'K1eGUI.app' -print -quit)"
          test -n "$APP_PATH"
          STAGING="$RUNNER_TEMP/k1egui-dmg"
          mkdir -p "$STAGING"
          ditto "$APP_PATH" "$STAGING/K1eGUI.app"
          ln -s /Applications "$STAGING/Applications"
          DMG="$GITHUB_WORKSPACE/source/release/K1eGUI-1.0.0-arm64.dmg"
          hdiutil create -volname "K1eGUI" -srcfolder "$STAGING" -ov -format UDZO "$DMG"
          hdiutil verify "$DMG"
          test -s "$DMG"

      - name: Publish DMG to private k1egui release
        env:
          GH_TOKEN: ${{ secrets.TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          DMG="$(find "$GITHUB_WORKSPACE/source/release" -maxdepth 1 -name '*.dmg' -type f -print -quit)"
          test -n "$DMG"
          SOURCE_SHA="$(git -C "$GITHUB_WORKSPACE/source" rev-parse HEAD)"
          TAG="v1.0.0-macos.fixed.${GITHUB_RUN_NUMBER}"
          NOTES="K1eGUI app bundle ad-hoc signed and smoke-tested on macOS before packaging. Built by GitBack Actions from private k1egui ref: $SOURCE_REF. Source commit: $SOURCE_SHA. Workflow run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
          # Re-runs reuse the same run number/tag. If the release already exists,
          # replace its DMG asset with the newly rebuilt and smoke-tested installer.
          for attempt in 1 2 3 4 5; do
            if gh release view "$TAG" --repo alzscriptz/k1egui >/dev/null 2>&1; then
              if gh release upload "$TAG" "$DMG" --repo alzscriptz/k1egui --clobber; then
                echo "Replaced DMG with newly smoke-tested build in release $TAG."
                exit 0
              fi
            else
              if gh release create "$TAG" "$DMG" \
                --repo alzscriptz/k1egui \
                --target "$SOURCE_SHA" \
                --title "K1eGUI macOS DMG $TAG" \
                --notes "$NOTES"; then
                echo "Published tested DMG in private release $TAG."
                exit 0
              fi
            fi
            echo "Release publish attempt $attempt failed; retrying in $((attempt * 10)) seconds."
            sleep $((attempt * 10))
          done
          echo "Unable to publish the tested DMG after 5 attempts." >&2
          exit 1
