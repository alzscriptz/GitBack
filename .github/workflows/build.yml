name: GitBack Release Builder
on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "Owner/repository to build"
        required: true
        type: string
      source_ref:
        description: "Branch or tag"
        required: true
        default: main
        type: string
      build_name:
        description: "Release name"
        required: true
        default: release
        type: string
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitBack runner
        uses: actions/checkout@v4
      - name: Checkout source repository (including .github/workflows)
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.TOKEN }}
          path: source
          fetch-depth: 0
      - name: Build the actual source project and collect deliverables
        shell: bash
        env:
          SOURCE_REPO: ${{ inputs.source_repo }}
          SOURCE_REF: ${{ inputs.source_ref }}
          BUILD_NAME: ${{ inputs.build_name }}
        run: |
          set -euo pipefail
          mkdir -p release
          cd source
          echo "Building $SOURCE_REPO @ $SOURCE_REF"
          if [ -f .github/workflows/build.yml ]; then
            echo "Found source .github/workflows/build.yml (kept in checkout)."
            echo "GitHub Actions YAML is not executable as a shell script; build commands must be represented by the source project's build scripts or a source workflow dispatch."
          fi
          produced=0
          if [ -f package.json ]; then
            if node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
              npm install --legacy-peer-deps
              npm run build
              if [ -d dist ] && [ "$(find dist -mindepth 1 -maxdepth 1 | wc -l)" -gt 0 ]; then
                cp -R dist/. ../release/
                produced=1
              elif [ -d build ] && [ "$(find build -mindepth 1 -maxdepth 1 | wc -l)" -gt 0 ]; then
                cp -R build/. ../release/
                produced=1
              fi
            else
              echo "package.json exists but has no build script; not inventing a generic output."
            fi
          fi
          find . -type f -iname '*.ipa' -not -path './node_modules/*' -not -path './.git/*' -print0 |
            while IFS= read -r -d '' ipa; do
              cp "$ipa" "../release/$(basename "$ipa")"
              echo "Collected existing IPA: $(basename "$ipa")"
            done
          cd ..
          if find release -maxdepth 1 -type f ! -name 'RELEASE-INFO.txt' -print -quit | grep -q .; then
            produced=1
          fi
          if [ "$produced" -ne 1 ]; then
            echo "::error::No real build output or prebuilt .ipa was produced. GitBack will not package the source tree as a fake release."
            exit 1
          fi
          printf 'Repository: %s\nBranch: %s\nBuild: %s\nBuilt at: %s\n' "$SOURCE_REPO" "$SOURCE_REF" "$BUILD_NAME" "$(date -u +%FT%TZ)" > release/RELEASE-INFO.txt
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release and attach IPA/build outputs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gitback-release-${{ github.run_number }}
          name: "${{ inputs.build_name }}"
          body: |
            Built from ${{ inputs.source_repo }} @ ${{ inputs.source_ref }}.
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: release/*
          fail_on_unmatched_files: false
