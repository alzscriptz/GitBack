name: GitBack Release Builder
on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "Owner/repository to build"
        required: true
        type: string
      source_ref:
        description: "Branch or tag"
        required: true
        default: main
        type: string
      build_name:
        description: "Release name"
        required: true
        default: release
        type: string
permissions:
  contents: write
  actions: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitBack runner
        uses: actions/checkout@v4
      - name: Checkout source repository (including .github/workflows)
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.TOKEN }}
          path: source
          fetch-depth: 0
      - name: Build project and collect IPA files
        shell: bash
        env:
          SOURCE_REPO: ${{ inputs.source_repo }}
          SOURCE_REF: ${{ inputs.source_ref }}
          BUILD_NAME: ${{ inputs.build_name }}
        run: |
          set -euo pipefail
          mkdir -p release
          cd source
          echo "Source: $SOURCE_REPO @ $SOURCE_REF"
          if [ -f package.json ]; then
            npm install --legacy-peer-deps
            npm run build --if-present
          fi
          if [ -d dist ] && [ "$(find dist -mindepth 1 -maxdepth 1 | wc -l)" -gt 0 ]; then
            cp -R dist/. ../release/
          elif [ -d build ] && [ "$(find build -mindepth 1 -maxdepth 1 | wc -l)" -gt 0 ]; then
            cp -R build/. ../release/
          fi
          # Preserve any prebuilt .ipa in the source checkout and put it at the
          # release root so it can be attached as a downloadable release asset.
          find . -type f -iname '*.ipa' -not -path './node_modules/*' -print0 |
            while IFS= read -r -d '' ipa; do
              base="$(basename "$ipa")"
              cp "$ipa" "../release/$base"
              echo "Collected IPA: $base"
            done
          cd ..
          if [ -z "$(find release -mindepth 1 -maxdepth 1 -type f -print -quit)" ]; then
            echo "Build completed, but no dist/build output or .ipa was found." > release/BUILD-INFO.txt
            echo "For iOS source projects, configure a macOS/Xcode build job to produce an IPA." >> release/BUILD-INFO.txt
          fi
          printf 'Repository: %s\nBranch: %s\nBuild: %s\nBuilt at: %s\n' "$SOURCE_REPO" "$SOURCE_REF" "$BUILD_NAME" "$(date -u +%FT%TZ)" > release/RELEASE-INFO.txt
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 30
      - name: Publish GitHub Release and attach IPA/build outputs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gitback-release-${{ github.run_number }}
          name: "${{ inputs.build_name }}"
          body: |
            Built from ${{ inputs.source_repo }} @ ${{ inputs.source_ref }}.
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: release/*
          fail_on_unmatched_files: false
