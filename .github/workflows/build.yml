name: GitBack Release Builder
on:
  workflow_dispatch:
    inputs:
      source_repo:
        description: "Owner/repository to build"
        required: true
        type: string
      source_ref:
        description: "Branch or tag"
        required: true
        default: main
        type: string
      build_name:
        description: "Release name"
        required: true
        default: release
        type: string
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitBack runner
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Checkout source repository
        uses: actions/checkout@v4
        with:
          repository: ${{ inputs.source_repo }}
          ref: ${{ inputs.source_ref }}
          token: ${{ secrets.TOKEN }}
          persist-credentials: false
          path: source
          fetch-depth: 0
      - name: Install .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: stable
      - name: Install Rust and Windows cross-compilation tools
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: Install Windows cross-compiler
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64
      - name: Build project using detected project files and collect real outputs
        shell: bash
        env:
          SOURCE_REPO: ${{ inputs.source_repo }}
          SOURCE_REF: ${{ inputs.source_ref }}
          BUILD_NAME: ${{ inputs.build_name }}
        run: |
          set -euo pipefail
          mkdir -p release
          cd source
          echo "GitBack building $SOURCE_REPO @ $SOURCE_REF"
          built=0

          # Prefer a project file; fall back to a solution file.
          project="$(find . -maxdepth 5 -type f -name '*.csproj' -print -quit || true)"
          if [ -z "$project" ]; then
            project="$(find . -maxdepth 5 -type f -name '*.sln' -print -quit || true)"
          fi
          if [ -n "$project" ]; then
            echo "Detected .NET project: $project"
            dotnet publish "$project" -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o "$GITHUB_WORKSPACE/release/dotnet-win-x64"
            built=1
          fi

          # Build Node projects only when their manifest declares a build script.
          if [ -f package.json ] && node -e "process.exit(require('./package.json').scripts?.build ? 0 : 1)"; then
            npm install --legacy-peer-deps
            npm run build
            for out in dist build; do
              if [ -d "$out" ] && [ -n "$(find "$out" -mindepth 1 -maxdepth 1 -print -quit)" ]; then
                mkdir -p "$GITHUB_WORKSPACE/release/$out"
                cp -R "$out/." "$GITHUB_WORKSPACE/release/$out/"
                built=1
              fi
            done
          fi

          if [ -f go.mod ]; then
            mkdir -p "$GITHUB_WORKSPACE/release/go"
            GOOS=windows GOARCH=amd64 go build -o "$GITHUB_WORKSPACE/release/go/app.exe" ./...
            built=1
          fi

          if [ -f Cargo.toml ]; then
            cargo build --release --target x86_64-pc-windows-gnu
            mkdir -p "$GITHUB_WORKSPACE/release/rust"
            find target/x86_64-pc-windows-gnu/release -maxdepth 1 -type f -name '*.exe' -exec cp {} "$GITHUB_WORKSPACE/release/rust/" + 2>/dev/null || true
            if find "$GITHUB_WORKSPACE/release/rust" -type f -name '*.exe' -print -quit | grep -q .; then built=1; fi
          fi

          # Collect checked-in binaries and archives without shell-escaped find groups.
          while IFS= read -r -d '' file; do
            case "${file,,}" in
              *.exe|*.dll|*.msi|*.appx|*.appxbundle|*.ipa|*.apk|*.aab|*.appimage|*.deb|*.rpm|*.jar|*.wasm|*.zip)
                rel="${file#./}"
                dest="$GITHUB_WORKSPACE/release/prebuilt/$rel"
                mkdir -p "$(dirname "$dest")"
                cp "$file" "$dest"
                echo "Collected real deliverable: $rel"
                ;;
            esac
          done < <(find . -type f -not -path './.git/*' -not -path './node_modules/*' -not -path './target/*' -print0)

          # Package plain static sites as a ZIP when no compiler manifest exists.
          if [ "$built" -eq 0 ] && [ -f index.html ]; then
            zip -qr "$GITHUB_WORKSPACE/release/$BUILD_NAME-static-site.zip" . -x '.git/*' 'node_modules/*' 'release/*' 'target/*'
            built=1
          fi

          if find "$GITHUB_WORKSPACE/release" -type f ! -name 'RELEASE-INFO.txt' -print -quit | grep -q .; then
            built=1
          fi
          if [ "$built" -ne 1 ]; then
            echo "::error::No supported build manifest or real deliverable was found. Add project-specific build instructions or a supported build manifest; GitBack will not fabricate an output."
            exit 1
          fi
          cd "$GITHUB_WORKSPACE"
          printf 'Repository: %s\nBranch: %s\nBuild: %s\nBuilt at: %s\n' "$SOURCE_REPO" "$SOURCE_REF" "$BUILD_NAME" "$(date -u +%FT%TZ)" > release/RELEASE-INFO.txt
      - name: Upload actual build outputs
        uses: actions/upload-artifact@v4
        with:
          name: release
          path: release/
          if-no-files-found: error
          retention-days: 30
      - name: Publish release with generated outputs
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gitback-release-${{ github.run_number }}
          name: "${{ inputs.build_name }}"
          body: |
            Build source: ${{ inputs.source_repo }} @ ${{ inputs.source_ref }}.
            Workflow run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          files: release/**/*
          fail_on_unmatched_files: false
